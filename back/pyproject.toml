[project]
name = "datapilot"
version = "0.1.0"
description = "DataPilot：基于 LangChain Agent + RAG 的智能数据分析助手（后端）"
authors = [
    { name = "Zps03", email = "3491482232@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi==0.143.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
# 应用项目（非库），不需要 build-system 与自身安装
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["utils"]  # tests/ 公共工具（经 tests/ 目录直接导入，不在 src 源根下）

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"  # 异步 fixture 用函数级事件循环（显式声明，防隐式回退）
pythonpath = ["src"]  # pytest 从 back/ 运行时，将源代码根加入导入路径
testpaths = ["tests"]  # 仅收集 tests/（src/ 下 test_*.py 是可独立运行的脚本，不是 pytest 用例）
addopts = "--strict-markers"
markers = [
    "online: 需要 DASHSCOPE_API_KEY 与公网（LLM / Embedding 调用），未配置时自动跳过",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
